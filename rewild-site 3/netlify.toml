[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"
  # Always build. Netlify's "no content change" check misreads the "rewild-site 3" folder name.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Old WordPress URLs
[[redirects]]
  from = "/sample-page/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/journal/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
[[redirects]]
  from = "/shop/cordyceps/"
  to = "/shop/cordyceps-militaris-powder/"
  status = 301
[[redirects]]
  from = "/cordyfuel/"
  to = "/shop/cordyceps-militaris-powder/"
  status = 301
[[redirects]]
  from = "/lions-mane/"
  to = "/shop/lions-mane-powder/"
  status = 301
[[redirects]]
  from = "/chaga/"
  to = "/shop/chaga-powder/"
  status = 301
[[redirects]]
  from = "/reishi/"
  to = "/shop/reishi-powder/"
  status = 301
[[redirects]]
  from = "/why-no-blends/"
  to = "/build-your-stack/"
  status = 301
[[redirects]]
  from = "/stack/"
  to = "/build-your-stack/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hq/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
